name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build installable APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          android/app/build/outputs/apk/debug/app-debug.apk#vku-room-booking-${GITHUB_REF_NAME}.apk
          --title "VKU Room Booking $GITHUB_REF_NAME"
          --notes "Installable Android debug APK for VKU Room Booking. Download the APK asset and install it on an Android device."
